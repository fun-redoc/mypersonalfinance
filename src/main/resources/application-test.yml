spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
      show-sql: true
      generate_statistics: true
    properties:
      hibernate:
        generate_statistics: true
        format_sql: true
        session:events:log:LOG_QUERIES_SLOWER_THAN_MS: 3
      javax:persistence:sharedCache:mode: ENABLE_SELECTIVE

logging:
  level:
    root: INFO
    org:
      springframework:
        security: OFF
        boot:test:mock:mockito:MockBean: OFF
      hibernate:
        stat: DEBUG
        SQL: DEBUG

